<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- This deployment has no login (see README "Access model"). noindex keeps it out of
     search results so the URL is at least not discoverable by searching. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Support Beyond — Timesheet Calculator</title>
<!-- Just the bird mark, not the full lockup: a favicon renders at 16px, where the
     wordmark would be an illegible smudge. Cropped and scaled from logo.png, so it
     is the real artwork rather than a redraw.

     Real files rather than an inline data URI, and favicon.ico specifically,
     because browsers request /favicon.ico on their own before any markup is
     parsed. Serving a 404 there means the tab falls back to the generic globe
     even when a perfectly valid <link> exists — which is exactly what happened.
     favicon.ico is a genuine ICO wrapping the same 64px PNG. -->
<link rel="icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
<style>
  /* Every colour on the splash and error screens comes from these, so that the
     pre-paint script below can re-point all of them at once. Getting one of them
     wrong is not a cosmetic matter: the first version of this hardcoded the dark
     theme's heading colour, which rendered the error text near-white on the light
     theme's near-white background — an invisible error message. */
  :root {
    --sb-page: #070A10; --sb-text: #EEF1F7; --sb-dim: #A6B4C7;
    --sb-card: #141B29; --sb-border: #2C394E; --sb-accent: #5B9BFF; --sb-warn: #F0A177;
  }
  html, body { margin: 0; padding: 0; background: var(--sb-page); }
  #root { min-height: 100vh; }
  #sb-splash {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: var(--sb-page); color: var(--sb-dim);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px;
    transition: opacity 0.25s ease;
  }
  #sb-splash.sb-gone { opacity: 0; pointer-events: none; }
  .sb-spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--sb-border); border-top-color: var(--sb-accent);
    animation: sb-rot 0.8s linear infinite;
  }
  @keyframes sb-rot { to { transform: rotate(360deg); } }
  .sb-fatal { max-width: 460px; text-align: center; line-height: 1.55; padding: 0 24px; }
  .sb-fatal h2 { margin: 0 0 8px; font-size: 16px; color: var(--sb-text); font-weight: 600; }
  .sb-fatal code { font-size: 12px; color: var(--sb-warn); word-break: break-word; }
  .sb-btn {
    margin-top: 14px; border: 1px solid var(--sb-border); background: var(--sb-card); color: var(--sb-text);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .sb-btn:hover { border-color: var(--sb-accent); }
</style>
<script>
// Pre-paint theme: the real value lives on the server, but painting the wrong background for
// the second the app takes to load is the whole flash. Cache it locally, apply before paint.
(function () {
  try {
    if (localStorage.getItem('sb_theme_cache') !== 'light') return;   // dark is the default above
    var s = document.createElement('style');
    s.textContent = ':root{--sb-page:#F7F9FC;--sb-text:#1A2433;--sb-dim:#5B6B82;' +
      '--sb-card:#FFFFFF;--sb-border:#DCE3EE;--sb-accent:#2A5FA8;--sb-warn:#B5502E}';
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<div id="sb-splash">
  <div class="sb-spin" id="sb-splash-spin"></div>
  <div id="sb-splash-msg">Loading your payroll data…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================================
   ONLINE LAYER — Supabase persistence for the single-file payroll app.

   Everything below this point up to the app source is the bridge between the
   React app (which only ever calls window.storage.get/set) and Postgres. The
   React app itself is unchanged from the offline single-file version.
   ========================================================================= */

/* --- config ---------------------------------------------------------------
   The anon key is MEANT to be public and embedded in client code — same
   category as a Stripe publishable key. There is no build step to substitute
   an env var and it would end up in the served file regardless. Do not "fix"
   this by hiding it.

   ACCESS: this deployment deliberately has no login. The RLS policies in
   supabase/schema.sql let anyone who opens this page read and write the
   payroll data. That was an explicit decision — see the README's "Access
   model" section, and supabase/lock-down.sql to reverse it.
   ------------------------------------------------------------------------ */
const SUPABASE_URL = 'https://grspmjuuqfvjkwlswioj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdyc3BtanV1cWZ2amt3bHN3aW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjUyNTYsImV4cCI6MjEwMzI0MTI1Nn0.19IwDPKIUcvnM4yaEVYg2-l2d5pmTDqYfG7dGlhzx8s';

const WORKSPACE_ID = 'main';          // single shared row; no per-user split, by design
const STASH_KEY = 'sb_payroll_pending_save_v1';
const THEME_CACHE_KEY = 'sb_theme_cache';
const CODE_CACHE_KEY = 'sb_payroll_compiled_v1';
const SAVE_LOG_KEY = 'sb_payroll_save_log';

const IS_CONFIGURED = !/YOURPROJECT|REPLACE_ME/.test(SUPABASE_URL + SUPABASE_ANON_KEY);
const sb = IS_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false },
}) : null;

/* --- splash ---------------------------------------------------------------
   A splash must always lift. Three independent exits: the app mounts, a fatal
   error replaces it, or the parse-time deadline below fires regardless of
   whether init ever got far enough to arm anything. Dismissal is idempotent.
   ------------------------------------------------------------------------ */
let splashDone = false;
function dismissSplash() {
  if (splashDone) return;
  splashDone = true;
  const el = document.getElementById('sb-splash');
  if (!el) return;
  el.classList.add('sb-gone');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
}
function splashMsg(text) {
  const el = document.getElementById('sb-splash-msg');
  if (el) el.textContent = text;
}
function showFatal(title, detail, opts) {
  const el = document.getElementById('sb-splash');
  if (!el) return;
  splashDone = false;
  el.classList.remove('sb-gone');
  el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'sb-fatal';
  const h = document.createElement('h2');
  h.textContent = title;
  const p = document.createElement('div');
  p.textContent = (opts && opts.hint) || 'Your data is safe on the server — nothing was written.';
  const c = document.createElement('div');
  c.style.marginTop = '10px';
  const code = document.createElement('code');
  code.textContent = detail || '';
  c.appendChild(code);
  const b = document.createElement('button');
  b.className = 'sb-btn';
  b.textContent = 'Try again';
  b.onclick = function () { location.reload(); };
  box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(b);
  el.appendChild(box);
  splashDone = true;                      // nothing may dismiss a fatal except a reload
}
// Armed at parse time on purpose: this fires whether or not init ever ran or threw.
setTimeout(function () {
  if (splashDone) return;
  showFatal('Still loading', 'The app took longer than 25 seconds to start.',
    { hint: 'Check your internet connection, then try again.' });
}, 25000);

/* --- save diagnostics -----------------------------------------------------
   Written to localStorage, not the console: the moment worth seeing is usually
   the one that tears the page down and takes the console with it. Off by
   default — one string compare when disabled.
   ------------------------------------------------------------------------ */
function slog(kind, detail) {
  try {
    if (localStorage.getItem('debugSaves') !== '1') return;
    const log = JSON.parse(localStorage.getItem(SAVE_LOG_KEY) || '[]');
    log.push({ t: new Date().toISOString(), kind: kind, detail: detail });
    localStorage.setItem(SAVE_LOG_KEY, JSON.stringify(log.slice(-400)));
  } catch (e) {}
}
window.startSaveDebug = function () {
  localStorage.setItem('debugSaves', '1');
  localStorage.removeItem(SAVE_LOG_KEY);
  return 'Save logging ON. Reproduce the problem, then run dumpSaveLog().';
};
window.stopSaveDebug = function () { localStorage.removeItem('debugSaves'); return 'Save logging OFF.'; };
window.dumpSaveLog = function () {
  const log = JSON.parse(localStorage.getItem(SAVE_LOG_KEY) || '[]');
  console.table(log);
  return log;
};

/* --- the db layer ---------------------------------------------------------
   Every read and write to Postgres lives in this object and nowhere else.

   Shape: the React app holds one JSON blob. Everything in it except
   committedSheets is small and hand-maintained, so it lives in a single JSONB
   column (payroll_config.data) — which means a new setting is never a
   migration. committedSheets grows by one per payroll week forever, so it gets
   its own row-per-sheet table: paged on read, upsert-and-pruned on write.
   ------------------------------------------------------------------------ */
const db = {
  async loadConfig() {
    const res = await sb.from('payroll_config').select('*').eq('id', WORKSPACE_ID).maybeSingle();
    if (res.error) throw res.error;
    return res.data || null;
  },

  // Supabase caps a REST response at 1000 rows with no error and no warning, so
  // anything that grows per user action has to be paged or it silently truncates.
  async loadSheets() {
    const out = [];
    let from = 0;
    for (;;) {
      const res = await sb.from('committed_sheets').select('*')
        .order('id', { ascending: true })   // required: range() without a stable sort skips/repeats
        .range(from, from + 999);
      if (res.error) throw res.error;
      const rows = res.data || [];
      out.push.apply(out, rows);
      if (!rows.length) break;
      from += rows.length;                  // advance by what came back, not a hardcoded 1000
    }
    return out.map(function (r) { return r.sheet; }).filter(Boolean);
  },

  async saveConfig(configObj) {
    const res = await sb.from('payroll_config')
      .upsert({ id: WORKSPACE_ID, data: configObj }, { onConflict: 'id' });
    if (res.error) throw res.error;
  },

  // Upsert-and-prune, never delete-then-insert: deleting all rows and re-inserting
  // leaves a window where the table is empty, and a refresh or a failed insert in
  // that window destroys the lot. The worst an interruption leaves here is a stale
  // row that the next save corrects.
  async saveSheets(sheets, state) {
    const rows = [];
    const seen = new Set();
    for (const s of sheets) {
      if (!s || !s.id) continue;
      seen.add(s.id);
      const json = JSON.stringify(s);
      if (state.savedJson.get(s.id) === json) continue;   // unchanged — don't re-send it
      rows.push({
        id: s.id, sheet: s,
        date_from: s.dateFrom || null, date_to: s.dateTo || null,
        imported_at: s.importedAt || null,
      });
    }
    for (let i = 0; i < rows.length; i += 100) {
      const res = await sb.from('committed_sheets').upsert(rows.slice(i, i + 100), { onConflict: 'id' });
      if (res.error) throw res.error;
    }
    const removed = Array.from(state.savedIds).filter(function (id) { return !seen.has(id); });
    if (removed.length) {
      const res = await sb.from('committed_sheets').delete().in('id', removed);
      if (res.error) throw res.error;
    }
    // Only now is the in-memory picture of what the server holds actually true.
    state.savedIds = seen;
    const nextJson = new Map();
    for (const s of sheets) if (s && s.id) nextJson.set(s.id, JSON.stringify(s));
    state.savedJson = nextJson;
    slog('saveSheets', { upserted: rows.length, deleted: removed.length, total: seen.size });
  },
};

/* --- window.storage -------------------------------------------------------
   The React app's entire persistence surface: get(key) -> {key, value} | null,
   and set(key, value). Same contract the offline localStorage build used, which
   is why the app source below needed no changes.
   ------------------------------------------------------------------------ */
const store = {
  savedIds: new Set(),
  savedJson: new Map(),
  serverUpdatedAt: 0,
  cachedValue: null,       // the blob as loaded, or as the app last handed it to us
  lastRequested: null,     // most recent value passed to set()
  lastConfirmed: null,     // most recent value a set() confirmed had landed
  loadFailed: false,
  writeChain: Promise.resolve(),
};

function composeBlob(configData, sheets) {
  return JSON.stringify(Object.assign({}, configData || {}, { committedSheets: sheets || [] }));
}

async function loadEverything() {
  const pair = await Promise.all([db.loadConfig(), db.loadSheets()]);
  const cfgRow = pair[0];
  const sheets = pair[1];
  store.savedIds = new Set(sheets.map(function (s) { return s.id; }).filter(Boolean));
  store.savedJson = new Map(sheets.filter(function (s) { return s && s.id; })
    .map(function (s) { return [s.id, JSON.stringify(s)]; }));
  store.serverUpdatedAt = cfgRow && cfgRow.updated_at ? Date.parse(cfgRow.updated_at) : 0;
  const blob = composeBlob(cfgRow && cfgRow.data, sheets);
  store.cachedValue = blob;
  store.lastConfirmed = blob;
  slog('load', { sheets: sheets.length, hadConfig: !!cfgRow, bytes: blob.length });
  return blob;
}

async function writeBlob(value) {
  const parsed = JSON.parse(value);
  const sheets = parsed.committedSheets || [];
  const rest = Object.assign({}, parsed);
  delete rest.committedSheets;
  // Sheets first: if the second write fails, a committed week exists whose km hasn't
  // been added to anyone's YTD yet — visible, and fixable by editing the sheet. The
  // other order bumps YTD km with no sheet to explain it, and re-committing doubles it.
  await db.saveSheets(sheets, store);
  await db.saveConfig(rest);
  try { localStorage.setItem(THEME_CACHE_KEY, rest.themeMode === 'light' ? 'light' : 'dark'); } catch (e) {}
}

window.storage = {
  async get(key) {
    return store.cachedValue === null ? null : { key: key, value: store.cachedValue };
  },
  async set(key, value) {
    if (store.loadFailed) throw new Error('refusing to save: the initial load failed');
    store.cachedValue = value;
    store.lastRequested = value;
    slog('set:queued', { bytes: value.length });
    // Serialised: two overlapping writes could otherwise prune rows using a stale
    // savedIds picture built before the first one landed.
    const run = store.writeChain.then(async function () {
      await writeBlob(value);
      if (store.lastRequested === value) {
        store.lastConfirmed = value;
        clearStash();
      }
      slog('set:ok', { bytes: value.length });
    });
    store.writeChain = run.catch(function () {});
    await run;
    return { key: key, value: value };
  },
  async delete(key) {
    let res = await sb.from('committed_sheets').delete().neq('id', '');
    if (res.error) throw res.error;
    res = await sb.from('payroll_config').delete().eq('id', WORKSPACE_ID);
    if (res.error) throw res.error;
    store.savedIds = new Set(); store.savedJson = new Map();
    store.cachedValue = null; store.lastConfirmed = null;
    return { key: key, deleted: true };
  },
};

/* --- unsaved-work stash ---------------------------------------------------
   Firing a pending save on unload does not work: the request is async and the
   browser tears the page down long before a round trip completes. What does
   work is synchronous — park the unsaved blob in localStorage on the way out
   and replay it on the next load, BEFORE the app loads anything else, so
   nothing has to reconcile against already-loaded state. This also survives a
   crash, a killed tab or a flat battery, which no unload-time request would.
   ------------------------------------------------------------------------ */
function clearStash() { try { localStorage.removeItem(STASH_KEY); } catch (e) {} }

function stashUnsaved() {
  try {
    if (store.lastRequested === null || store.lastRequested === store.lastConfirmed) return;
    localStorage.setItem(STASH_KEY, JSON.stringify({
      v: 1, workspace: WORKSPACE_ID, savedAt: Date.now(), value: store.lastRequested,
    }));
    slog('stash', { bytes: store.lastRequested.length });
  } catch (e) {}
}

// pagehide, not beforeunload: beforeunload is unreliable on mobile Safari and blocks
// bfcache. visibilitychange covers backgrounding the tab, where the page can be
// discarded without pagehide ever firing.
addEventListener('pagehide', stashUnsaved);
addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') stashUnsaved();
});

async function replayStash(loadedBlob) {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STASH_KEY) || 'null'); }
  catch (e) { clearStash(); return loadedBlob; }
  if (!s || s.v !== 1 || s.workspace !== WORKSPACE_ID || typeof s.value !== 'string') { clearStash(); return loadedBlob; }
  if (s.value === loadedBlob) { clearStash(); return loadedBlob; }
  // A stash older than what the server already holds came from a session that was
  // superseded on another device — replaying it would undo the newer work.
  if (store.serverUpdatedAt && s.savedAt < store.serverUpdatedAt) {
    slog('stash:stale', { stashedAt: s.savedAt, serverAt: store.serverUpdatedAt });
    clearStash();
    return loadedBlob;
  }
  slog('stash:replay', { bytes: s.value.length });
  try {
    await writeBlob(s.value);
    store.cachedValue = s.value;
    store.lastConfirmed = s.value;
    clearStash();                        // cleared only after a save covering all of it
    return s.value;
  } catch (e) {
    slog('stash:replay-failed', String(e && e.message));
    return loadedBlob;                   // kept, not dropped — the next load tries again
  }
}

/* --- compile + mount ------------------------------------------------------
   The app is JSX, so it needs Babel. Compiling ~190KB of source on every load
   is about a second of nothing, so the compiled output is cached in
   localStorage against a hash of the source: edit the source and the hash
   changes, so a stale cache is not possible. On a cache hit Babel is never
   even downloaded.
   ------------------------------------------------------------------------ */
function hashSource(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return 'v1-' + str.length.toString(36) + '-' + h.toString(36);
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = function () { reject(new Error('could not load ' + src)); };
    document.head.appendChild(el);
  });
}

async function compileApp(source) {
  const key = hashSource(source);
  let cached = null;
  try {
    const raw = JSON.parse(localStorage.getItem(CODE_CACHE_KEY) || 'null');
    if (raw && raw.key === key && typeof raw.code === 'string') cached = raw.code;
  } catch (e) {}

  if (cached) {
    try { return new Function(cached); }
    catch (e) { try { localStorage.removeItem(CODE_CACHE_KEY); } catch (e2) {} }
  }

  splashMsg('Preparing the app (first run on this device)…');
  await loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js');
  const code = window.Babel.transform(source, {
    presets: ['react'], sourceType: 'script', compact: false,
  }).code;
  try { localStorage.setItem(CODE_CACHE_KEY, JSON.stringify({ key: key, code: code })); } catch (e) {}
  return new Function(code);
}

async function boot() {
  if (!IS_CONFIGURED) {
    showFatal('Not connected to a database yet',
      'SUPABASE_URL and SUPABASE_ANON_KEY are still placeholders in index.html.',
      { hint: 'Follow the setup steps in README.md, then paste your project URL and anon key into index.html.' });
    return;
  }

  // Retry before giving up: a flaky first request is common, and declaring the app
  // dead on one timeout would be worse than waiting a couple of seconds.
  let blob = null, lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { blob = await loadEverything(); lastErr = null; break; }
    catch (e) {
      lastErr = e;
      splashMsg('Connection trouble — retrying…');
      await new Promise(function (r) { setTimeout(r, 700 * (attempt + 1)); });
    }
  }
  if (lastErr) {
    // Mounting anyway would show the built-in defaults as if they were the real roster,
    // and the first edit would then overwrite good server data with them.
    store.loadFailed = true;
    showFatal('Could not reach the database', String((lastErr && lastErr.message) || lastErr),
      { hint: 'Nothing has been changed. Check your internet connection, then try again.' });
    return;
  }

  blob = await replayStash(blob);

  try {
    const parsed = JSON.parse(blob);
    localStorage.setItem(THEME_CACHE_KEY, parsed.themeMode === 'light' ? 'light' : 'dark');
  } catch (e) {}

  const source = document.getElementById('app-source').textContent;
  let factory;
  try { factory = await compileApp(source); }
  catch (e) {
    showFatal('Could not start the app', String((e && e.message) || e),
      { hint: 'This usually means the connection dropped mid-load. Your data is untouched.' });
    return;
  }

  try {
    factory();                                   // defines window.__PayrollApp
    const App = window.__PayrollApp;
    if (!App) throw new Error('the app did not define itself');
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    dismissSplash();
  } catch (e) {
    console.error(e);
    showFatal('The app failed to start', String((e && e.message) || e),
      { hint: 'Your data is safe on the server. If this keeps happening, run localStorage.clear() in the console and reload.' });
  }
}
</script>

<!-- The app itself. This is the source of truth — edit it here, in place. It sits in a

     than pre-built, so the file you edit is exactly the file that gets served. -->
<script type="text/x-jsx-source" id="app-source">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const { createPortal } = ReactDOM;

}

const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></Icon>;

// The Support Beyond lockup, for the header. The supplied artwork has a black
// wordmark, which is unreadable on the navy header bar — and the header is dark
// in BOTH themes, so one variant covers both. The bird keeps its original
// colours; only the wordmark was converted to white, by turning each letter
// pixel's darkness into its opacity so the letterforms stay properly
// anti-aliased rather than going ragged at the edges.
// logo.png is the supplied Support Beyond artwork, untouched — the source of
// truth, so there is never a redrawn or re-encoded copy to drift from it.
//
// It can't be used as-is in the header: the wordmark is black, and the header bar
// is dark navy in the light theme and near-black in the dark one. So the white
// version is derived here, at load, rather than baked into a second file:
//
//   - crop to the artwork's actual bounds (the PNG has generous padding)
//   - leave the bird alone; it is coloured and reads fine on a dark bar
//   - for the wordmark only, turn each pixel's DARKNESS into its OPACITY and set
//     the colour to white. Recolouring pixel-by-pixel instead would eat the
//     anti-aliased edges and leave the letterforms ragged.
//
// The split between mark and wordmark is found by saturation: the bird is
// saturated colour, the wordmark is pure neutral black, and there is a clear
// gap of empty columns between them.
const SB_LOGO_SRC = "/logo.png";

function buildHeaderLogo() {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error("logo.png did not load"));
    img.onload = () => {
      try {
        const W = img.width, H = img.height;
        const src = document.createElement("canvas");
        src.width = W; src.height = H;
        const sctx = src.getContext("2d");
        sctx.drawImage(img, 0, 0);
        const data = sctx.getImageData(0, 0, W, H).data;
        const alphaAt = (i, j) => data[(j * W + i) * 4 + 3];

        // content bounds
        let minX = W, maxX = -1, minY = H, maxY = -1;
        for (let i = 0; i < W; i++) {
          for (let j = 0; j < H; j++) {
            if (alphaAt(i, j) > 20) {
              if (i < minX) minX = i;
              if (i > maxX) maxX = i;
              if (j < minY) minY = j;
              if (j > maxY) maxY = j;
            }
          }
        }
        if (maxX < 0) return reject(new Error("logo.png looks empty"));

        // last column holding saturated colour = the right edge of the bird
        let lastColoured = minX;
        for (let i = minX; i <= maxX; i++) {
          for (let j = minY; j <= maxY; j++) {
            const k = (j * W + i) * 4;
            if (data[k + 3] < 40) continue;
            const mx = Math.max(data[k], data[k + 1], data[k + 2]);
            const mn = Math.min(data[k], data[k + 1], data[k + 2]);
            if (mx > 40 && (mx - mn) / mx > 0.25) { lastColoured = i; break; }
          }
        }
        // The bird's grey tail runs on past the last COLOURED column and touches the
        // "S" — there is no empty column between mark and wordmark to split on, so
        // splitting on a gap walks straight through the S and leaves it black on a
        // black bar. What separates them is a pinch: ink thins to a trough at the
        // tail's tip and then jumps at the first letter. Walk into the trough and
        // stop once ink is clearly climbing again.
        const inkIn = (i) => {
          let n = 0;
          for (let j = minY; j <= maxY; j++) if (alphaAt(i, j) > 20) n++;
          return n;
        };
        let wordStart = Math.min(lastColoured + 1, maxX);
        let leastInk = inkIn(wordStart);
        for (let i = wordStart + 1; i <= Math.min(maxX, lastColoured + 400); i++) {
          const v = inkIn(i);
          if (v < leastInk) { leastInk = v; wordStart = i; }
          else if (v > leastInk * 2 + 4) break;
        }

        const boxW = maxX - minX + 1, boxH = maxY - minY + 1;
        const outH = 72, scale = outH / boxH, outW = Math.round(boxW * scale);
        const out = document.createElement("canvas");
        out.width = outW; out.height = outH;
        const octx = out.getContext("2d");
        octx.imageSmoothingQuality = "high";
        octx.drawImage(img, minX, minY, boxW, boxH, 0, 0, outW, outH);

        const od = octx.getImageData(0, 0, outW, outH);
        const p = od.data;
        const splitAt = (wordStart - minX) * scale - 2;
        for (let j = 0; j < outH; j++) {
          for (let i = 0; i < outW; i++) {
            const k = (j * outW + i) * 4;
            if (i <= splitAt || p[k + 3] === 0) continue;
            const lum = 0.2126 * p[k] + 0.7152 * p[k + 1] + 0.0722 * p[k + 2];
            p[k] = 255; p[k + 1] = 255; p[k + 2] = 255;
            p[k + 3] = Math.round(p[k + 3] * (1 - lum / 255));
          }
        }
        octx.putImageData(od, 0, 0);
        resolve({ src: out.toDataURL("image/png"), ratio: outW / outH });
      } catch (e) { reject(e); }
    };
    img.src = SB_LOGO_SRC;
  });
}

function cleanVal(v) { if (v == null) return ""; return String(v).replace(/^'/, "").trim(); }
function slugify(name) { return cleanVal(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function parseDuration(v) {
  const s = cleanVal(v);
  if (!s || s === "-") return 0;
  const full = s.match(/(\d+)\s*h\s*(\d+)\s*m/i);
  if (full) return parseInt(full[1], 10) + parseInt(full[2], 10) / 60;
  const hOnly = s.match(/(\d+)\s*h/i);
  const mOnly = s.match(/(\d+)\s*m/i);
  if (hOnly || mOnly) { const h = hOnly ? parseInt(hOnly[1], 10) : 0; const m = mOnly ? parseInt(mOnly[1], 10) : 0; return h + m / 60; }

  return isNaN(n) ? 0 : n;
}
function toISODate(dateStr) {
  const s = cleanVal(dateStr);
  const parts = s.split("/");
  if (parts.length !== 3) return null;
  const mo = parseInt(parts[0], 10), da = parseInt(parts[1], 10), yr = parseInt(parts[2], 10);
  if (!mo || !da || !yr) return null;

}
function dayNameFromISO(iso) {
  if (!iso) return "";

  const dt = new Date(y, m - 1, d);
  return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][dt.getDay()];
}
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);

function truncate2(n) {

function parseTimeToMinutes(v) {
  const s = cleanVal(v);

  if (!m) return null;

// A File System directory handle can't go in localStorage (not JSON-safe),
// but IndexedDB supports structured clone, so it can persist there across
// sessions — meaning "choose a backup folder" only has to happen once.
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("sb-backup-db", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function crc32(bytes) {

      let c = n;

      0x50, 0x4b, 0x03, 0x04, ...zu16(20), ...zu16(0x0800), ...zu16(0),
      ...zu16(time), ...zu16(dt), ...zu32(crc), ...zu32(size), ...zu32(size),
      ...zu16(nameBytes.length), ...zu16(0),
    ]);

      0x50, 0x4b, 0x01, 0x02, ...zu16(20), ...zu16(20), ...zu16(0x0800), ...zu16(0),
      ...zu16(time), ...zu16(dt), ...zu32(crc), ...zu32(size), ...zu32(size),

function parseCSVRows(text) {
  const rows = []; let row = []; let cur = ""; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; } else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); cur = ""; rows.push(row); row = []; }
      else if (c === "\r") { /* skip */ }
      else cur += c;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.length > 1 || (r[0] && r[0].trim()));
}

  const segments = [];
  const open = {};
  let skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = cleanVal(r[nameIdx]);
    if (!name) { skipped++; continue; }
    const code = codeIdx !== -1 ? cleanVal(r[codeIdx]) : "";
    const empKey = code || name;
    const dateISO = toISODate(r[dateIdx]);
    const dateRaw = cleanVal(r[dateIdx]);
    const day = dayNameFromISO(dateISO);
    const entryType = cleanVal(r[typeIdx]);
    const note = notesIdx !== -1 ? cleanVal(r[notesIdx]) : "";

    if (entryType === "In") {
      if (open[empKey]) segments.push(open[empKey]); // defensively close a dangling one
      open[empKey] = { key: empKey, name, code, dateISO, dateRaw, day, hours: parseDuration(r[durIdx]), firstInMin: parseTimeToMinutes(r[timeIdx]), lastOutMin: null, notes: note ? [note] : [] };
    } else if (entryType === "Out") {
      const t = parseTimeToMinutes(r[timeIdx]);
      if (open[empKey]) {
        open[empKey].lastOutMin = t;
        if (note) open[empKey].notes.push(note);
        segments.push(open[empKey]);
        delete open[empKey];
      } else {
        skipped++;
      }
    } else if (entryType === "Hours") {
      segments.push({ key: empKey, name, code, dateISO, dateRaw, day, hours: parseDuration(r[durIdx]), firstInMin: null, lastOutMin: null, notes: note ? [note] : [] });
    }
  }
  for (const k of Object.keys(open)) segments.push(open[k]);
  const shifts = segments.filter((s) => s.hours > 0);
  return { shifts, skipped, format: "timeEntries" };
}

function parseDailyRawRows(rows) {
  const header = rows[0].map((h) => cleanVal(h));
  const idx = (name) => header.findIndex((h) => h.toLowerCase() === name.toLowerCase());
  const dayIdx = idx("Day"), dateIdx = idx("Date"), nameIdx = idx("Full Name"), codeIdx = idx("Member Code");
  const payrollIdx = idx("Payroll Hours"), workedIdx = idx("Worked Hours"), firstInIdx = idx("First In"), lastOutIdx = idx("Last Out");
  const shifts = []; let skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = cleanVal(r[nameIdx]);
    if (!name) { skipped++; continue; }
    const code = codeIdx !== -1 ? cleanVal(r[codeIdx]) : "";
    const dateRaw = cleanVal(r[dateIdx]);
    const dateISO = toISODate(dateRaw);
    let hoursRaw = payrollIdx !== -1 ? cleanVal(r[payrollIdx]) : "";
    if (!hoursRaw || hoursRaw === "-") hoursRaw = workedIdx !== -1 ? cleanVal(r[workedIdx]) : "";
    const hours = parseDuration(hoursRaw);
    if (hours <= 0) continue;
    shifts.push({ key: code || name, name, code, dateISO, dateRaw, day: dayIdx !== -1 ? cleanVal(r[dayIdx]) : dayNameFromISO(dateISO), hours, firstInMin: firstInIdx !== -1 ? parseTimeToMinutes(r[firstInIdx]) : null, lastOutMin: lastOutIdx !== -1 ? parseTimeToMinutes(r[lastOutIdx]) : null, notes: [] });
  }
  return { shifts, skipped, format: "dailyRaw" };
}

// Jibble sometimes records one unbroken stretch of work as two entries — a clock
// out and a clock straight back in, most often right on midnight (out 11:59pm,
// in 12:00am). Left as two segments they are classified independently: the second
// starts a "new" shift, so it takes the new day's base rate and can never reach
// the night window, which only opens to a shift that ran through midnight. That
// makes the pay depend on whether someone pressed a button, not on the work.
//
// The gap has to stay tight. Merging across a long gap is what broke Donna's
// numbers once before: a genuine broken shift — a morning block and an evening
// block — got treated as one long evening shift because the day's last clock-out
// was after 8pm. Five minutes is deliberately far short of any real break.
const CONTINUOUS_SHIFT_GAP_MINUTES = 5;

// Minutes between one segment finishing and the next starting, or null if they
// can't be compared. Both sides are measured from the FIRST segment's midnight,
// so a segment that ran past midnight reads as 1440+ rather than wrapping to 0.
function gapBetweenSegments(a, b) {
  if (a.lastOutMin == null || b.firstInMin == null || !a.dateISO || !b.dateISO) return null;
  const aStart = a.firstInMin == null ? 0 : a.firstInMin;
  const aEnd = a.lastOutMin <= aStart ? a.lastOutMin + 1440 : a.lastOutMin;
  let bStart;
  if (b.dateISO === a.dateISO) bStart = b.firstInMin;
  else if (b.dateISO === addDaysISO(a.dateISO, 1)) bStart = b.firstInMin + 1440;
  else return null;
  return bStart - aEnd;
}

// The merged segment keeps the FIRST one's date and clock-in, which is what makes
// the day-type and window classification follow the start of the work.
function mergeContinuousSegments(shifts) {
  const byEmployee = {};
  for (const s of shifts) (byEmployee[s.key] = byEmployee[s.key] || []).push(s);
  const out = [];
  for (const key of Object.keys(byEmployee)) {
    const list = byEmployee[key].slice().sort((a, b) => {
      const d = String(a.dateISO || "").localeCompare(String(b.dateISO || ""));
      return d !== 0 ? d : (a.firstInMin == null ? 0 : a.firstInMin) - (b.firstInMin == null ? 0 : b.firstInMin);
    });
    let current = null;
    for (const s of list) {
      if (current) {
        const gap = gapBetweenSegments(current, s);
        if (gap !== null && gap >= 0 && gap <= CONTINUOUS_SHIFT_GAP_MINUTES) {
          current.hours += s.hours;
          current.lastOutMin = s.lastOutMin;
          current.notes = current.notes.concat(s.notes);
          continue;
        }
        out.push(current);
      }
      current = { ...s, notes: s.notes.slice() };
    }
    if (current) out.push(current);
  }
  return out;
}

function parseJibbleCSV(text) {
  const rows = parseCSVRows(text);
  if (rows.length < 2) return { shifts: [], error: "No data rows found in that CSV." };
  const format = detectFormat(rows[0]);
  if (format === "timeEntries") {
    const r = parseTimeEntriesRows(rows);
    return { ...r, shifts: mergeContinuousSegments(r.shifts), error: null };
  }
  if (format === "dailyRaw") {
    const r = parseDailyRawRows(rows);
    return { ...r, shifts: mergeContinuousSegments(r.shifts), error: null };
  }
  return { shifts: [], error: "Couldn't recognise this CSV — export a Jibble Time Entries report and try again." };
}

/* note extraction: km, breaks, sleepovers -------------------------------- */

function extractKm(notes) {
  const joined = notes.join(" | ");
  const re = /(\d+(?:\.\d+)?)\s*k\s*[nm]s?\b/gi;
  let m; let total = 0; const matches = [];
  while ((m = re.exec(joined))) { total += parseFloat(m[1]); matches.push(m[0].trim()); }
  return { total, matches };
}

// Catches numbers in a note that AREN'T already a confident km match or part
// of a break claim — e.g. "Sabine 138" or a typo'd unit. These aren't
// auto-added; they're surfaced for the user to approve or dismiss, since a
// bare number could be almost anything.
function extractKmCandidates(notes) {
  const kmRe = /\d+(?:\.\d+)?\s*k\s*[nm]s?\b/gi;
  const breakRe = /\d+\s*breaks?\s*(?:@|at)\s*\$?\d+(?:\.\d+)?/gi;
  const candidates = [];
  notes.forEach((note, noteIdx) => {
    const consumed = [];
    let m;
    kmRe.lastIndex = 0;
    while ((m = kmRe.exec(note))) consumed.push([m.index, m.index + m[0].length]);
    breakRe.lastIndex = 0;
    while ((m = breakRe.exec(note))) consumed.push([m.index, m.index + m[0].length]);
    const numRe = /\b\d+(?:\.\d+)?\b/g;
    let nm;
    while ((nm = numRe.exec(note))) {
      const s = nm.index, e = nm.index + nm[0].length;
      const overlap = consumed.some(([cs, ce]) => s < ce && e > cs);
      if (!overlap) candidates.push({ note, value: parseFloat(nm[0]), start: s, noteIdx });
    }
  });
  return candidates;
}

function extractBreakClaims(notes, allowances) {
  const joined = notes.join(" | ");
  const re = /(\d+)\s*breaks?\s*(?:@|at)\s*\$?(\d+(?:\.\d+)?)/gi;
  let m; const matches = []; let count1 = 0; let count2 = 0;
  while ((m = re.exec(joined))) {
    const n = parseInt(m[1], 10);
    const noteAmt = parseFloat(m[2]);
    const d1 = Math.abs(noteAmt - (allowances.break1 || 0));
    const d2 = Math.abs(noteAmt - (allowances.break2 || 0));
    if (d2 < d1) count2 += n; else count1 += n;
    matches.push(m[0].trim());
  }
  const amount = count1 * (allowances.break1 || 0) + count2 * (allowances.break2 || 0);
  return { count1, count2, count: count1 + count2, amount, matches };
}

function extractSleepovers(notes) {
  const re = /sleepover|slept\s*over|overnight\s*stay/i;
  const quotes = [];
  for (const n of notes) {
    if (re.test(n)) quotes.push(n.trim().replace(/\s+/g, " "));
  }
  return { count: quotes.length, quotes };
}

/* =========================================================================
   PAYROLLER CROSS-CHECK — parses pasted text from a Payroller pay-run
   export (one or more concatenated payslips) so it can be compared against
   what this app worked out from the Jibble CSV for the same week.
   ========================================================================= */
function matchNameToRoster(name, roster, aliases) {
  const norm = cleanVal(name).toLowerCase().trim();
  if (aliases[norm]) {
    const found = roster.find((r) => r.id === aliases[norm]);
    if (found) return found;
  }
  const exact = roster.find((r) => r.name.toLowerCase().trim() === norm);
  if (exact) return exact;
  const slug = slugify(name);
  const bySlug = roster.find((r) => slugify(r.name) === slug);
  if (bySlug) return bySlug;
  const firstWord = norm.split(/\s+/)[0];
  if (firstWord && aliases[firstWord]) {
    const found = roster.find((r) => r.id === aliases[firstWord]);
    if (found) return found;
  }
  return null;
}

function parsePayrollerText(text) {
  const blocks = text.split(/(?=Name:\s*[A-Za-z])/).filter((b) => /Period Starting/.test(b));
  return blocks.map((block) => {
    const nameMatch = block.match(/Name:\s*([A-Za-z .'\-]+?)\s*(?:Period Starting|Address:)/);
    const name = nameMatch ? nameMatch[1].trim() : "Unknown";
    const grab = (re) => { const m = block.match(re); return m ? parseFloat(m[1]) : 0; };
    const weekday = grab(/Ordinary Hours(?!\s*-)\s+([\d.]+)\s+\$/);
    const afternoon = grab(/Ordinary Hours - Afternoon\s+([\d.]+)\s+\$/i);
    const night = grab(/Ordinary Hours - Night\s+([\d.]+)\s+\$/i);
    const saturday = grab(/Ordinary Hours - Saturday\s+([\d.]+)\s+\$/i);
    const sunday = grab(/Ordinary Hours - Sunday\s+([\d.]+)\s+\$/i);
    const publicHoliday = grab(/Ordinary Hours - Public [Hh]oliday\s+([\d.]+)\s+\$/i);
    const otTier1 = grab(/Ordinary Hours - Overtime under 2\s*hrs\s+([\d.]+)\s+\$/i);
    const otTier2 = grab(/Ordinary Hours - Overtime over 2\s*hrs\s+([\d.]+)\s+\$/i);
    const higherRate = grab(/Ordinary Hours - [Hh]igher rate\s+([\d.]+)\s+\$/);
    const kmMatches = [...block.matchAll(/Cents per KM\s+(\d+)\s+\$/g)].map((m) => parseInt(m[1], 10));
    const km = kmMatches.length ? Math.max(...kmMatches) : 0;
    // Payroller prints one "Other - General" line per allowance RATE, so two
    // breaks at $20.82 and three at $27.56 arrive as two lines of 2 and 3, not
    // one line of 5 — and a sleepover at $60.02 is a third. The Jibble side of
    // the comparison adds all of those together, so this side has to as well.
    //
    // Taking the largest line (what this used to do) reported 3 against Jibble's
    // 5 and flagged a clean week as wrong. Plain summing is not safe either: a
    // payslip that repeats a line would double it. Group by rate, keep the
    // largest count seen at each rate, then add the rates together.
    //
    // Note this is the opposite of the km handling above, deliberately: the two
    // "Cents per KM" lines are the SAME kilometres split into a taxable and an
    // exempt component, so there the largest single line is the real figure.
    const otherByRate = {};
    for (const m of block.matchAll(/Other - General\s+(\d+)\s+\$?\s*([\d.]+)/g)) {
      const units = parseInt(m[1], 10);
      const rate = m[2];
      if (!(rate in otherByRate) || units > otherByRate[rate]) otherByRate[rate] = units;
    }
    const otherAllowanceUnits = Object.values(otherByRate).reduce((a, n) => a + n, 0);
    const total = weekday + afternoon + night + saturday + sunday + publicHoliday + otTier1 + otTier2 + higherRate;
    return { name, weekday, afternoon, night, saturday, sunday, publicHoliday, otTier1, otTier2, higherRate, total, km, otherAllowanceUnits };
  });
}

/* =========================================================================
   DAY-TYPE + OVERTIME ENGINE
   ========================================================================= */

function baseDayType(shift, holidaySet) {
  if (shift.dateISO && holidaySet.has(shift.dateISO)) return "publicHoliday";
  if (shift.day === "Saturday") return "saturday";
  if (shift.day === "Sunday") return "sunday";
  return "weekday";
}

// Splits one shift segment's hours across the pay-rate windows it overlaps.
//
// Up to midnight, the day it started on governs. On a weekday that means before
// 8pm = weekday rate and 8pm-12am = afternoon; Saturday, Sunday and public
// holiday shifts are NOT carved up by time of day — the whole of that day is one
// rate.
//
// Once it ticks over midnight the hours belong to the new day, and take that
// day's rate or the overtime rate, whichever is higher. Overtime is settled
// later in computeWeekBuckets, which only ever converts weekday/afternoon/night
// hours and always pays at or above the bucket it took them from, so the
// comparison that has to happen HERE is against `night` — the treatment those
// small hours would otherwise have had. That is not a foregone conclusion: on
// most levels Saturday beats night, but on custom13 the night rate ($63) is
// higher than the Saturday rate ($61), and the higher one has to win.
//
// `rates` is the employee's level. Without it the comparison can't be made and
// the small hours fall back to `night`, which is the pre-existing behaviour.
//
// Hours are scaled against the segment's real recorded duration so the parts
// always add back up to exactly the original total.
function splitSegmentByWindow(shift, holidaySet, rates) {
  const baseType = baseDayType(shift, holidaySet);
  if (shift.firstInMin == null || shift.lastOutMin == null || shift.hours <= 0) {
    return [{ dayType: baseType, hours: shift.hours, dateISO: shift.dateISO }];
  }
  let start = shift.firstInMin;
  let end = shift.lastOutMin;
  if (end <= start) end += 1440;
  const span = end - start;
  if (span <= 0) return [{ dayType: baseType, hours: shift.hours, dateISO: shift.dateISO }];
  const scale = shift.hours / (span / 60);

  const nextISO = addDaysISO(shift.dateISO, 1);
  let nextType;
  if (holidaySet.has(nextISO)) nextType = "publicHoliday";
  else {
    const nd = dayNameFromISO(nextISO);
    nextType = nd === "Saturday" ? "saturday" : nd === "Sunday" ? "sunday" : "weekday";
  }

  const rateOf = (type) => (rates ? Number(rates[type === "weekday" ? "hourly" : type]) || 0 : 0);
  const smallHoursType =
    nextType === "weekday" || !rates ? "night" : rateOf(nextType) > rateOf("night") ? nextType : "night";

  const windows = baseType === "weekday"
    ? [
        { from: 0, to: 1200, type: baseType },
        { from: 1200, to: 1440, type: "afternoon" },
        { from: 1440, to: 1920, type: smallHoursType },
        { from: 1920, to: 2880, type: nextType },
      ]
    : [
        { from: 0, to: 1440, type: baseType },
        { from: 1440, to: 1920, type: smallHoursType },
        { from: 1920, to: 2880, type: nextType },
      ];

  const parts = [];
  for (const w of windows) {
    const os = Math.max(start, w.from), oe = Math.min(end, w.to);
    if (oe > os) {
      parts.push({ dayType: w.type, hours: ((oe - os) / 60) * scale, dateISO: shift.dateISO });
    }
  }
  return parts.length ? parts : [{ dayType: baseType, hours: shift.hours, dateISO: shift.dateISO }];
}

// Splits every segment by pay window first, then works out overtime as two
// independent checks against the *raw* (untrimmed) hours — daily (>10hrs on
// any Mon-Fri day) and weekly (>38hrs across the whole Mon-Sat pool, with
// Saturday counted toward the pool but never itself reduced). Whichever
// check produces the larger OT figure is the one that actually governs the
// week (this matches real payslips: a small daily breach that's covered by
// the weekly figure doesn't "stack" on top of it). When the weekly check
// governs, the OT hours come out of weekday hours only, leaving afternoon/
// night loading untouched. When only the daily check triggers, that day's
// own excess comes out of that day's own hours (night, then afternoon, then
// weekday) — matching how a single evening-finishing long day behaves on
// an actual payslip.
function computeWeekBuckets(shiftsForWeek, holidaySet, { skipOvertime, rates }) {
  const subparts = [];
  for (const s of shiftsForWeek) subparts.push(...splitSegmentByWindow(s, holidaySet, rates));

  const buckets = { weekday: 0, afternoon: 0, night: 0, saturday: 0, sunday: 0, publicHoliday: 0 };
  if (skipOvertime) {
    for (const p of subparts) buckets[p.dayType] += p.hours;
    return { ...buckets, otTier1: 0, otTier2: 0 };
  }

  const byDate = {};
  for (const p of subparts) { const k = p.dateISO; if (!byDate[k]) byDate[k] = []; byDate[k].push(p); }

  const dayRecords = [];
  const satDayTotals = {};
  for (const dateKey of Object.keys(byDate)) {
    const parts = byDate[dateKey];
    for (const p of parts) {
      if (p.dayType === "sunday" || p.dayType === "publicHoliday" || p.dayType === "saturday") {
        buckets[p.dayType] += p.hours;
        if (p.dayType === "saturday") satDayTotals[dateKey] = (satDayTotals[dateKey] || 0) + p.hours;
      }
    }
    const eligible = parts.filter((p) => p.dayType === "weekday" || p.dayType === "afternoon" || p.dayType === "night");
    if (eligible.length === 0) continue;
    const rec = { weekday: 0, afternoon: 0, night: 0 };
    for (const p of eligible) rec[p.dayType] += p.hours;
    rec.excess = Math.max(0, rec.weekday + rec.afternoon + rec.night - 10);
    dayRecords.push(rec);
  }

  // Saturday has its own overtime point at 12 hours, not 10 — hours 10-12
  // are still paid at the plain Saturday rate (no "under 2hrs" OT tier for
  // Saturday), and only the portion past 12 hours becomes overtime, charged
  // straight at the over-2hrs rate with no grace tier of its own.
  const saturdayOT = Object.values(satDayTotals).reduce((a, total) => a + Math.max(0, total - 12), 0);
  buckets.saturday -= saturdayOT;

  const dailyExcessSum = dayRecords.reduce((a, r) => a + r.excess, 0);
  const weekdaySumRaw = dayRecords.reduce((a, r) => a + r.weekday, 0);
  const afternoonSumRaw = dayRecords.reduce((a, r) => a + r.afternoon, 0);
  const nightSumRaw = dayRecords.reduce((a, r) => a + r.night, 0);
  const weeklyPool = weekdaySumRaw + afternoonSumRaw + nightSumRaw + buckets.saturday;
  const weeklyExcess = Math.max(0, weeklyPool - 38);
  const totalOT = Math.max(dailyExcessSum, weeklyExcess);

  if (weeklyExcess >= dailyExcessSum) {
    buckets.weekday = Math.max(0, weekdaySumRaw - totalOT);
    buckets.afternoon = afternoonSumRaw;
    buckets.night = nightSumRaw;
  } else {
    let wd = 0, aft = 0, night = 0;
    for (const rec of dayRecords) {
      let remaining = rec.excess;
      const local = { weekday: rec.weekday, afternoon: rec.afternoon, night: rec.night };
      for (const cat of ["night", "afternoon", "weekday"]) {
        const take = Math.min(remaining, local[cat]);
        local[cat] -= take; remaining -= take;
        if (remaining <= 0) break;
      }
      wd += local.weekday; aft += local.afternoon; night += local.night;
    }
    buckets.weekday = wd; buckets.afternoon = aft; buckets.night = night;
  }

  return { ...buckets, otTier1: Math.min(2, totalOT), otTier2: Math.max(0, totalOT - 2) + saturdayOT };
}

/* =========================================================================
   AWARD PAY-SUMMARY TEXT PARSER
   ========================================================================= */

function parseAwardText(text) {
  const grab = (re) => { const m = text.match(re); return m ? parseFloat(m[1]) : null; };
  const grabLast = (re) => { const matches = [...text.matchAll(re)]; return matches.length ? parseFloat(matches[matches.length - 1][1]) : null; };
  const levelMatch = text.match(/level\s*(\d+)\s*-\s*pay point\s*(\d+)/i);
  const rates = {
    hourly: grab(/Hourly Pay Rate:\s*\$?([\d.]+)/i),
    saturday: grab(/Saturday\s*\$?([\d.]+)\s*per hour/i),
    sunday: grab(/Sunday\s*\$?([\d.]+)\s*per hour/i),
    afternoon: grab(/Afternoon shift[^$]*\$?([\d.]+)\s*per hour/i),
    night: grab(/Night shift[^$]*\$?([\d.]+)\s*per hour/i),
    publicHoliday: grabLast(/Public holiday\s*\$?([\d.]+)\s*per hour/gi),
    otTier1: grab(/Overtime\s*-\s*Monday to Saturday\s*-\s*first 2 hours\s*\$?([\d.]+)\s*per hour/i),
    otTier2: grab(/Overtime\s*-\s*Monday to Saturday\s*-\s*after 2 hours\s*\$?([\d.]+)\s*per hour/i),
  };
  const brokenShift = grab(/Broken shift allowance\s*\$?([\d.]+)\s*per broken shift/i);
  const levelLabel = levelMatch ? `Level ${levelMatch[1]}.${levelMatch[2]}` : null;
  const levelKeyGuess = levelMatch ? AWARD_LEVEL_GUESS[`${levelMatch[1]}-${levelMatch[2]}`] || "" : "";
  const found = Object.values(rates).some((v) => v != null) || brokenShift != null;
  return { rates, brokenShift, levelLabel, levelKeyGuess, found };
}

/* =========================================================================
   PUBLIC HOLIDAY BULK-PASTE PARSER
   ========================================================================= */

function parseHolidayText(text, defaultYear) {
  const lines = text.split(/\n/).map((l) => l.trim()).filter(Boolean);
  const monthNames = "January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec";
  const weekdayLead = "(?:(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\\.?,?\\s+)?";
  const dateRe = new RegExp(weekdayLead + "(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + monthNames + ")\\.?\\s*,?\\s*(\\d{4})?", "i");
  const monthMap = { january: 1, jan: 1, february: 2, feb: 2, march: 3, mar: 3, april: 4, apr: 4, may: 5, june: 6, jun: 6, july: 7, jul: 7, august: 8, aug: 8, september: 9, sep: 9, sept: 9, october: 10, oct: 10, november: 11, nov: 11, december: 12, dec: 12 };
  const results = [];
  for (const line of lines) {
    const m = line.match(dateRe);
    if (!m) continue;
    const day = parseInt(m[1], 10);
    const month = monthMap[m[2].toLowerCase()];
    const year = m[3] ? parseInt(m[3], 10) : defaultYear;
    if (!month || !year) continue;
    const pad = (n) => String(n).padStart(2, "0");
    const iso = `${year}-${pad(month)}-${pad(day)}`;
    let name = line.replace(m[0], "\t").split("\t").map((s) => s.replace(/^[\s,\-:–—|]+|[\s,\-:–—|]+$/g, "").trim()).filter(Boolean).join(" ").trim();
    if (!name) name = "Public holiday";
    results.push({ date: iso, name });
  }
  return results;
}

    quoteStyle: { fontSize: 10.5, color: T.textDim, fontStyle: "italic", marginTop: 3, maxWidth: 220, lineHeight: 1.4 },
    confirmBoxStyle: { marginTop: 12, fontSize: 13, background: T.accentSoft, border: `1px solid ${T.cardBorder}`, borderRadius: 10, padding: "10px 12px" },
